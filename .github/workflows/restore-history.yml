name: Restore original writing history
on:
  push:
    paths:
      - '.github/workflows/restore-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore original commits and branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/history/cup-world-original.bundle?ref=main" \
            -o original.bundle
          git clone original.bundle original
          cd original
          git bundle verify ../original.bundle
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          git branch original-main refs/remotes/origin/main
          git push origin refs/heads/original-main:refs/heads/original-main refs/heads/revision-illustrated:refs/heads/original-revision-illustrated
