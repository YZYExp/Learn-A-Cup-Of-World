name: Build book and deploy Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build full book and individual chapters
        run: |
          python build_book.py
          python export_chapters.py

      - name: Build web reader
        run: python build_site.py

      - name: Validate generated books and website
        run: python scripts/check_build.py

      - name: Upload PDF and chapter bundle
        uses: actions/upload-artifact@v4
        with:
          name: cup-world-books
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload website bundle
        uses: actions/upload-artifact@v4
        with:
          name: cup-world-site
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload Pages deployment artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
